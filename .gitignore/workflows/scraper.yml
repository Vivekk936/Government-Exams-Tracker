name: Government Exam Scraper

on:
  schedule:
    # 2:00 AM IST = 20:30 UTC (previous day)
    - cron: "30 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # 2. Setup Python
      # -----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------
      # 3. Install dependencies
      # -----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------
      # 4. Run government exam scraper
      # -----------------------------------------
      - name: Run scraper
        run: |
          python -m src.scraper

      # -----------------------------------------
      # 5. Show generated files
      # -----------------------------------------
      - name: Check generated data
        run: |
          echo "Generated files:"
          ls -lh data/

          echo ""
          echo "CSV records:"
          wc -l data/exams.csv

      # -----------------------------------------
      # 6. Commit updated CSV
      # -----------------------------------------
      - name: Save updated CSV
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/exams.csv

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update government exam data"

            git push

          fi